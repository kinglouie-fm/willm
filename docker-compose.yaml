services:
  frontend-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3101:3101"
    depends_on:
      - flask-api
      - mongodb

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  flask-api:
    build:
      context: ./willm-flask-api
      dockerfile: Dockerfile
    ports:
      - "8031:8031"
    environment:
      - FLASK_API_KEY=${FLASK_API_KEY}
    depends_on:
      chromadb:
        condition: service_healthy

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    ports:
      - "8032:8031"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"
        ]
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 10s

volumes:
  mongodb-data:
  chroma-data:
